[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfgparams"
# Single source of truth (Constitution IV): the version lives in
# src/mfgparams/__init__.py and is read statically from there.
dynamic = ["version"]
description = "Metal machining calculation library and interactive CLI, covering drilling and milling operations."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "kniklas" }]
keywords = ["machining", "drilling", "milling", "cnc", "manufacturing", "calculator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Exactly what running the test suite needs, and nothing else. `tox` and CI's
# `test` job install this rather than the full `dev` toolchain so that the
# Python-version gate this feature exists to enforce measures *the library*:
# with `dev`, the first time `sphinx`/`mypy`/`bandit`/`radon` drops 3.9,
# `tox -e py39` and CI's `test (3.9)` leg would fail at install time even
# though mfgparams itself is fine on 3.9 — the same "unrelated tooling pins
# the floor" failure the `setuptools` split in this extra fixed
# (specs/013-tox-multi-python-testing research.md #4).
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Used by tests/static/test_python_version_consistency.py to read
    # .github/workflows/ci.yml's `test` job matrix as structured YAML rather
    # than by regex. Declared explicitly rather than relied on as a transitive
    # dependency of `bandit` (specs/013-tox-multi-python-testing FR-008).
    "pyyaml>=6.0",
    # tests/integration/test_packaging_bundled_data.py shells out to
    # `python -m build` to assert the bundled `data/*.toml` files really ship
    # inside the wheel. Without `build` installed those assertions were
    # `importorskip`-ed in every tox env and every CI matrix leg, so dropping a
    # path from `[tool.setuptools.package-data]` would have shipped silently
    # (specs/013-tox-multi-python-testing research.md #4).
    "build>=1.0",
]
dev = [
    "mfgparams[test]",
    "ruff>=0.4",
    "black>=26.3.1; python_version >= '3.10'",
    "black<26; python_version < '3.10'",
    "setuptools>=83.0.0; python_version >= '3.10'",
    "setuptools>=64.0.0,<83.0.0; python_version < '3.10'",
    "tox>=4",
    "sphinx>=7.0",
    "mypy>=1.10",
    "radon>=6.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
mfgparams = "mfgparams.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "mfgparams.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfgparams = [
    "data/*.toml",
    "operations/drilling/data/*.toml",
    "operations/milling/end_milling/data/*.toml",
    "operations/milling/face_milling/data/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mfgparams --cov-report=term-missing --cov-fail-under=90"
markers = [
    "performance: opt-in legacy-hardware time/memory budget checks (see tests/performance/)",
]

[tool.coverage.run]
source = ["mfgparams"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
files = ["src/mfgparams"]
warn_return_any = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
# Only surface medium+ severity findings in CI (FR-004); any future named-skip
# suppressions (`# nosec`) must carry a trailing rationale comment per
# contracts/ci-checks-contract.md's Suppression contract (FR-009).

# Maintainability Index (FR-002) is enforced via `radon mi`, which has no
# native pyproject.toml configuration section or CLI failure-threshold flag.
# Its minimum grade threshold is versioned in scripts/check_maintainability.py
# (research.md #2; xenon does NOT enforce MI - it only wraps radon's
# cyclomatic-complexity harvester - see that script's module docstring).
