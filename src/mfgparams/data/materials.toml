# Bundled default workpiece materials (FR-004 of 001-metal-drilling-calc).
#
# Lossless re-encoding of the hard-coded `_MATERIALS` list that used to live
# in `registry.py` (specs/005-configurable-materials-tools/research.md #4).
# Reference cutting-speed/feed values are canonical-metric, HSS-baseline
# figures drawn from widely published machining data (Machinery's Handbook /
# Sandvik Coromant general-purpose reference ranges for twist drilling); see
# specs/001-metal-drilling-calc/research.md #4.
#
# `material_type` groups entries into the two-step (type -> material) selection
# flow of specs/008-material-categorization. It is a free-form identifier, not a
# closed enum: declaring a new value (e.g. "cement", "plastic") in this file or
# in a user-supplied `--materials-config` file registers a new category with no
# code change (FR-004). Entries omitting the key fall back to "uncategorized".
#
# Schema: specs/005-configurable-materials-tools/contracts/materials-config-schema.md
#
# `material_number`/`short_notation` (specs/023-material-selector-dialog) are
# deliberately left blank on every bundled entry below, including Mild
# Steel and Stainless Steel: each bundled name is a generic material
# family, not a single grade, and even a name with a widely-cited "default"
# grade in one standards tradition (e.g. Mild Steel -> EN 10025-2's S235JR)
# is not the unambiguous default in every tradition (ASTM's A36 is at
# least as commonly meant by "mild steel"), so stamping one EN/DIN number
# on the generic entry would misrepresent it to a user relying on the
# picker's search as if it were authoritative (FR-010's supported blank
# case, used here rather than guessing). Populate these two fields on a
# *specific*, grade-named entry instead -- see
# specs/023-material-selector-dialog/quickstart.md's "Chromoly Steel"
# fixture, or contracts/materials-config-schema-delta.md, for the pattern
# -- in a materials-config file, where the entry's own name states the
# exact grade the number/notation describes (023-material-selector-dialog
# tasks.md T035; narrowed to zero populated bundled entries during PR #106
# review after this same ambiguity was raised first against Brass, then
# against Mild Steel/Stainless Steel too).

[[materials]]
name = "Mild Steel"
material_type = "metal"
reference_cutting_speed = 25.0
reference_feed_per_rev = 0.20
specific_cutting_force = 1900.0
unit_system = "metric"

