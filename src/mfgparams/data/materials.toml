# Bundled default workpiece materials (FR-004 of 001-metal-drilling-calc).
#
# Lossless re-encoding of the hard-coded `_MATERIALS` list that used to live
# in `registry.py` (specs/005-configurable-materials-tools/research.md #4).
# Reference cutting-speed/feed values are canonical-metric, HSS-baseline
# figures drawn from widely published machining data (Machinery's Handbook /
# Sandvik Coromant general-purpose reference ranges for twist drilling); see
# specs/001-metal-drilling-calc/research.md #4.
#
# `material_type` groups entries into the two-step (type -> material) selection
# flow of specs/008-material-categorization. It is a free-form identifier, not a
# closed enum: declaring a new value (e.g. "cement", "plastic") in this file or
# in a user-supplied `--materials-config` file registers a new category with no
# code change (FR-004). Entries omitting the key fall back to "uncategorized".
#
# Schema: specs/005-configurable-materials-tools/contracts/materials-config-schema.md
#
# `material_number`/`short_notation` (specs/023-material-selector-dialog) are
# populated only for the two bundled entries where a single EN/DIN
# designation is *the* unambiguous, universally-cited default for that
# generic name -- not merely "a" plausible grade: Mild Steel -> S235JR
# (1.0038, EN 10025-2's baseline structural/mild-steel grade) and
# Stainless Steel -> X5CrNi18-10 (1.4301, AISI 304, the default assumed
# whenever "stainless steel" is named with no further qualifier). Every
# other bundled entry -- Aluminum, Cast Iron, Brass, Titanium -- is left
# without either field: each spans multiple, materially different alloys
# in ordinary use (e.g. Brass covers CuZn37, CuZn40, CuZn30, ... with no
# single alloy any more "the" default brass than another) with no single
# conventional default the way the two populated entries have -- assigning
# one arbitrary grade's number here would misrepresent the entry, so it
# stays blank per FR-010's supported case rather than guessed
# (023-material-selector-dialog tasks.md T035; Brass's notation fields
# were removed during PR #106 review after this exact ambiguity was
# raised against all three originally-populated entries).

[[materials]]
name = "Mild Steel"
material_type = "metal"
reference_cutting_speed = 25.0
reference_feed_per_rev = 0.20
specific_cutting_force = 1900.0
unit_system = "metric"
material_number = "1.0038"
short_notation = "S235JR"

