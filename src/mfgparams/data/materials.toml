# Bundled default workpiece materials (FR-004 of 001-metal-drilling-calc).
#
# Lossless re-encoding of the hard-coded `_MATERIALS` list that used to live
# in `registry.py` (specs/005-configurable-materials-tools/research.md #4).
# Reference cutting-speed/feed values are canonical-metric, HSS-baseline
# figures drawn from widely published machining data (Machinery's Handbook /
# Sandvik Coromant general-purpose reference ranges for twist drilling); see
# specs/001-metal-drilling-calc/research.md #4.
#
# `material_type` groups entries into the two-step (type -> material) selection
# flow of specs/008-material-categorization. It is a free-form identifier, not a
# closed enum: declaring a new value (e.g. "cement", "plastic") in this file or
# in a user-supplied `--materials-config` file registers a new category with no
# code change (FR-004). Entries omitting the key fall back to "uncategorized".
#
# Schema: specs/005-configurable-materials-tools/contracts/materials-config-schema.md
#
# `material_number`/`short_notation` (specs/023-material-selector-dialog) are
# deliberately left blank on every *generic-family* bundled entry below
# (Mild Steel, Stainless Steel, Aluminum, Cast Iron, Brass, Titanium):
# each name is a family, not a single grade, and even a name with a
# widely-cited "default" grade in one standards tradition (e.g. Mild
# Steel -> EN 10025-2's S235JR) is not the unambiguous default in every
# tradition (ASTM's A36 is at least as commonly meant by "mild steel"),
# so stamping one EN/DIN number on the generic entry would misrepresent
# it to a user relying on the picker's search as if it were authoritative
# (FR-010's supported blank case, used here rather than guessing).
#
# "S235JR Structural Steel" below is the one bundled entry that *does*
# populate both fields, precisely because its own name states the exact
# grade the numbers describe -- unlike the generic entries above, there
# is no ambiguity to misrepresent. It exists so the picker has real,
# out-of-the-box EN-number/short-notation data to search without
# requiring a `--materials-config` override (PR #106 follow-up: manual
# testing after the review loop found the picker had nothing to search
# at all once every generic entry's notations were removed -- a real
# feature-usability regression, not just an overcautious data choice).
# A user materials-config entry follows the same pattern for its own
# grade-specific materials -- see quickstart.md's "Chromoly Steel"
# fixture, or contracts/materials-config-schema-delta.md, for another
# example (023-material-selector-dialog tasks.md T035/T052).

[[materials]]
name = "Mild Steel"
material_type = "metal"
reference_cutting_speed = 25.0
reference_feed_per_rev = 0.20
specific_cutting_force = 1900.0
unit_system = "metric"

