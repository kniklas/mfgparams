name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency-vulnerability scan (spec.md FR-005;
    # specs/003-ci-quality-security-gates) and multi-agent skill sync
    # (specs/011-multi-agent-skill-sync), both independent of pull request
    # activity.
    - cron: "0 6 * * 1"
  # Allows manually re-running the scan/sync (e.g. T033's post-merge
  # validation, confirming a fix after a disclosed CVE, or an on-demand
  # skill-sync check per specs/011-multi-agent-skill-sync FR-005) without
  # waiting for the cron.
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

# Least-privilege default GITHUB_TOKEN scope for every job below that does
# not define its own `permissions:` block (CodeQL actions/missing-workflow-
# permissions). Only `quality-summary` (needs pull-requests: write to post
# its comment) and `deploy-docs` (needs pages: write / id-token: write)
# require broader scopes and already declare their own job-level
# `permissions:`, which takes precedence over this default.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Cyclomatic complexity (FR-001) is enforced here via ruff's C90/mccabe
      # rule, not in a separate job (specs/003-ci-quality-security-gates
      # contracts/ci-checks-contract.md).
      # scripts/sync_agent_integrations.py and scripts/setup_skill_symlinks.py
      # are named explicitly (not the whole scripts/ dir) so this doesn't
      # also pull the pre-existing, unrelated scripts/check_maintainability.py
      # into scope (specs/011-multi-agent-skill-sync tasks.md T002;
      # Constitution Principle IX).
      - run: ruff check src/ tests/ scripts/sync_agent_integrations.py scripts/setup_skill_symlinks.py
      - run: black --check src/ tests/ scripts/sync_agent_integrations.py scripts/setup_skill_symlinks.py
      # Static analysis of the helper above only proves the *script* is
      # clean; this runs it against the real checkout so the committed
      # `.claude/skills/*` symlinks themselves are gated (a deleted,
      # wrong-target, or replaced-by-a-copy link fails the build). The
      # script's own unit tests can't cover this: they redirect
      # SOURCE_DIR/DEST_DIR at a temporary tree. `--check` writes nothing
      # and exits non-zero on any missing/wrong link; the ubuntu-latest
      # checkout materializes real symlinks, so the links are genuine here
      # (Constitution Principle XI v1.9.1).
      - run: python scripts/setup_skill_symlinks.py --check

  complexity:
    name: complexity
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Maintainability Index (FR-002) only; cyclomatic complexity is the
      # `lint` job's responsibility (see contracts/ci-checks-contract.md).
      # NOTE: xenon only wraps radon's cyclomatic-complexity harvester, not
      # its Maintainability Index metric, so it cannot enforce this check -
      # see scripts/check_maintainability.py for why.
      # `id: mi` lets the `quality-summary` job (specs/004-pr-quality-check-summary)
      # surface the script's `mi_summary` $GITHUB_OUTPUT line as a job output
      # below, without a second `radon` invocation (research.md #4).
      - id: mi
        run: python scripts/check_maintainability.py src/ scripts/sync_agent_integrations.py scripts/setup_skill_symlinks.py
    outputs:
      mi_summary: ${{ steps.mi.outputs.mi_summary }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # scripts/sync_agent_integrations.py and scripts/setup_skill_symlinks.py
      # are named explicitly, same rationale as the `lint` job above
      # (specs/011-multi-agent-skill-sync T002).
      - run: mypy src/mfgparams scripts/sync_agent_integrations.py scripts/setup_skill_symlinks.py

  security:
    name: security
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # scripts/sync_agent_integrations.py and scripts/setup_skill_symlinks.py
      # are named explicitly, same rationale as the `lint` job above
      # (specs/011-multi-agent-skill-sync T002).
      - run: bandit -r src scripts/sync_agent_integrations.py scripts/setup_skill_symlinks.py -ll

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pip-audit

  # Weekly (same schedule as dependency-scan above) check that every
  # installed coding-agent integration (Copilot, Claude Code, ...) still
  # matches Spec Kit's upstream template source; opens a pull request only
  # when real drift is found (specs/011-multi-agent-skill-sync;
  # Constitution Principle XI). Runs only on `schedule`/`workflow_dispatch`,
  # never on `push`/`pull_request`, since it is independent of ordinary
  # code-change activity (contracts/sync-workflow-contract.md "Triggers").
  sync-agent-integrations:
    name: sync-agent-integrations
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Serialize scheduled and manually-dispatched runs: both push the same
    # fixed branch via create-pull-request's --force-with-lease, so an
    # overlapping run (e.g. a manual dispatch during the Monday cron) would
    # otherwise race and one could fail with a stale lease. `queued` (the
    # default cancel-in-progress: false) waits its turn rather than
    # abandoning a partially-pushed run.
    concurrency:
      group: sync-agent-integrations
      cancel-in-progress: false
    steps:
      # Explicit ref: a manual workflow_dispatch can be launched against any
      # branch from the Actions UI; without pinning to `main` here, the sync
      # branch/PR create-pull-request opens would target whatever branch was
      # dispatched from instead of `main`, breaking schedule/manual parity
      # (contracts/sync-workflow-contract.md "Triggers").
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Pinned to the same spec-kit version this repository already tracks
      # (.specify/integration.json); never self-upgraded by this job (FR-012;
      # research.md #2).
      - run: pip install uv
      - run: >-
          uv tool install specify-cli
          --from "git+https://github.com/github/spec-kit.git@v1.0.1"
      - id: sync
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          python scripts/sync_agent_integrations.py
      # No `permissions:` override here: this job relies solely on the
      # workflow-level least-privilege default (`contents: read`) plus the
      # dedicated PAT below - it is never granted merge/auto-approve
      # capability, so opened pull requests go through the repository's
      # normal required review exactly like any other pull request (FR-006).
      - if: steps.sync.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # A dedicated PAT, not the default GITHUB_TOKEN: pull requests
          # opened with the default token never trigger this repository's
          # other `pull_request`-scoped required checks (research.md #4),
          # which would leave this PR without CI signal for reviewers.
          token: ${{ secrets.SYNC_PR_TOKEN }}
          branch: chore/sync-agent-integrations
          commit-message: "chore: sync agent integrations from upstream"
          title: "chore: sync agent integrations from upstream"
          body: ${{ steps.sync.outputs.pr_body }}

  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # Verifies every officially supported Python version on every pull request
    # (specs/013-tox-multi-python-testing FR-005/FR-006), not just the single
    # `env.PYTHON_VERSION` every other job pins. `fail-fast: false` so a
    # failure on one version doesn't cancel the others before they report
    # their own independent result (research.md #3).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `.[test]`, not `.[dev]`: this job is the Python-version gate, so it must
      # install only what the suite needs. Pulling the whole dev toolchain would
      # make `test (3.9)` fail at install time the first time `sphinx`/`mypy`/
      # `bandit` drops 3.9, even though the library itself still supports it
      # (specs/013-tox-multi-python-testing research.md #4).
      - run: pip install -e ".[test]"
      # Only `--cov-report=xml` (needed by the Codecov step below) is passed
      # here; `--cov=mfgparams`, `--cov-report=term-missing` and
      # `--cov-fail-under=90` come from `[tool.pytest.ini_options].addopts`,
      # which `tox` inherits too. Restating them on the command line would
      # silently *override* addopts — bumping the threshold in pyproject.toml
      # would then raise it for `tox` but leave CI enforcing the stale value
      # (code review finding; research.md #4).
      - run: pytest --cov-report=xml
      # Publishes coverage.xml to Codecov so README.md's coverage badge stays
      # auto-updating (Constitution Principle VII; specs/003-ci-quality-security-gates).
      # Requires a CODECOV_TOKEN repository secret from https://codecov.io.
      # Restricted to the canonical leg (research.md #5) so this doesn't
      # upload four near-identical reports per push/PR. Compared against
      # `env.PYTHON_VERSION` (the single declared canonical version) rather
      # than a separate hardcoded literal, so this can't silently drift from
      # it (specs/013-tox-multi-python-testing research.md #5 remediation).
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == env.PYTHON_VERSION
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      # Surfaces the coverage percentage to the `quality-summary` job
      # (specs/004-pr-quality-check-summary research.md #3); reuses the
      # `.coverage` data file the `pytest --cov=...` step above already left
      # in place, rather than a second coverage computation.
      #
      # Published as an ARTIFACT from the single canonical leg rather than as
      # a matrix job output, because a matrix job cannot expose a
      # per-version output at all: all four legs write the same output name
      # and the value that survives is whichever leg finished last. That is a
      # race no matter which legs are gated in or out, and coverage here is
      # genuinely NOT identical across interpreters — `src/mfgparams/config.py`
      # and `src/mfgparams/registry_config.py` each carry an
      # interpreter-conditional `tomllib`/`tomli` import fallback, so 3.9/3.10
      # execute two lines that 3.11+ never reach (98.88% vs 98.59% as of this
      # feature's own validation run). A single artifact written by only the
      # `env.PYTHON_VERSION` leg makes the reported number both deterministic
      # and attributable to a named interpreter
      # (specs/013-tox-multi-python-testing research.md #5).
      #
      # `if: !cancelled()` rather than the implicit `success()`: without an
      # override, a canonical leg whose `pytest` step failed would skip this
      # too and report no coverage at all, when the partial run it did
      # complete is exactly what a reviewer wants to see. `!cancelled()`
      # rather than `always()` because `always()` also forces both steps to
      # run when the *workflow* is cancelled, where the upload would fight a
      # torn-down run and add a spurious failed step to an otherwise clean
      # cancellation. `!cancelled()` covers the failed-pytest case and
      # nothing more (code review finding). `|| true` because `coverage
      # report` exits non-zero when the total is below `fail_under`, which
      # must not fail this step on top of the `pytest` failure that already
      # flagged it.
      - name: Record canonical coverage percentage
        if: ${{ !cancelled() && matrix.python-version == env.PYTHON_VERSION }}
        run: coverage report --format=total > coverage-pct.txt || true
      - name: Upload canonical coverage percentage
        if: ${{ !cancelled() && matrix.python-version == env.PYTHON_VERSION }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pct
          path: coverage-pct.txt
          if-no-files-found: ignore

  # Informational-only legacy-hardware time/memory budget signal
  # (specs/006-legacy-hardware-performance-tests). Separate from `test`;
  # never blocks merges (`continue-on-error: true` below). Its result and
  # achieved metric ARE surfaced to `quality-summary` as a distinct,
  # non-blocking row (FR-013; contracts/ci-performance-job-contract.md) via
  # the `status_label`/`metric` outputs computed below, not via
  # `needs.performance.result` (which `continue-on-error` always reports as
  # `success` regardless of the suite's actual outcome).
  performance:
    name: performance
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      MFGPARAMS_PERFORMANCE_SUMMARY_PATH: /tmp/mfgparams_perf_summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - id: run_performance_tests
        run: MFGPARAMS_RUN_PERFORMANCE_TESTS=1 pytest tests/performance/ -m performance -p no:cacheprovider --no-cov -s
        continue-on-error: true
      # Computes the Suite Run Summary (data-model.md) from the JSON file
      # the test step above wrote (tests/performance/conftest.py's
      # pytest_sessionfinish + results.py), and surfaces `status_label`/
      # `metric` as job outputs for `quality-summary` to consume (T028/T028b).
      - id: summary
        if: always()
        env:
          # `job.status` reflects the job's own accumulated conclusion so
          # far (success/failure/cancelled) and, unlike the `cancelled()`
          # expression function, is usable outside `if:` conditions,
          # letting this step distinguish a genuinely cancelled run from a
          # normal skip-before-measurement (T034).
          JOB_STATUS: ${{ job.status }}
          # The pytest step's own outcome (independent of its `continue-
          # on-error: true`, which always leaves the job's overall status
          # "success" regardless). Needed because a collection/import/setup
          # failure still triggers `pytest_sessionfinish` and writes
          # `has_measurements: False` — indistinguishable from a genuine
          # skip unless this step's actual pass/fail outcome is inspected.
          TEST_OUTCOME: ${{ steps.run_performance_tests.outcome }}
        run: |
          python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import os

          path = os.environ["MFGPARAMS_PERFORMANCE_SUMMARY_PATH"]
          summary_load_error = False
          try:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
          except (FileNotFoundError, json.JSONDecodeError):
              data = {}
              summary_load_error = True

          is_cancelled = os.environ.get("JOB_STATUS", "") == "cancelled"
          test_failed = os.environ.get("TEST_OUTCOME", "") == "failure"
          if summary_load_error:
              status_label = "cancelled" if is_cancelled else "fail"
              metric = "—"
          elif not data.get("has_measurements"):
              if is_cancelled:
                  status_label = "cancelled"
              elif test_failed:
                  # pytest itself failed (e.g. a collection/import/setup
                  # error) before any case could record a measurement - a
                  # real failure, not a normal opt-in skip.
                  status_label = "fail"
              else:
                  status_label = "skipped"
              metric = "—"
          else:
              cpu_ok = data["cpu_pin_enforced_overall"]
              memory_ok = data["memory_ceiling_enforced_overall"]
              degraded = not (cpu_ok and memory_ok)
              # An invalid memory *measurement* (issue #23: a missing/zero/
              # negative reading) always takes failure precedence over the
              # weaker "⚠️ degraded" label. Degraded only describes
              # unenforced-but-still-measured best-effort mode (e.g. macOS
              # lacking the pin/ceiling mechanisms, FR-009/FR-010), which is
              # allowed to still "pass" — an invalid reading never is (this
              # can't happen on Windows: without the `resource` module
              # there, no measurement is ever taken, so it is always
              # invalid rather than valid-but-unenforced).
              invalid_measurement = data.get("any_invalid_memory_measurement", False)
              # pytest can fail even when has_measurements is true: the
              # opt-in subprocess-boundary tests
              # (tests/performance/test_harness_subprocess_boundary.py)
              # run in this same pytest step but never call
              # results.record(), so a failure there wouldn't otherwise be
              # reflected in the recorded Suite Run Summary at all. Give
              # the pytest outcome failure the same top precedence as an
              # invalid measurement rather than letting a "pass"/"⚠️
              # degraded" label from the recorded cases mask it.
              if test_failed or invalid_measurement:
                  status_label = "fail"
              elif degraded:
                  status_label = "⚠️ degraded"
              elif data["overall_pass"]:
                  status_label = "pass"
              else:
                  status_label = "fail"

              # Reported in milliseconds (not seconds) with 2-decimal
              # precision: these calculations complete in well under a
              # second, so a seconds-based ".2f" format rounds every real
              # measurement down to a misleading "0.00s".
              worst_time_ms = data["worst_case_time_seconds"] * 1000
              worst_memory_mb = round(data["worst_case_memory_bytes"] / (1024 * 1024))
              time_budget_ms = data["time_budget_seconds"] * 1000
              memory_budget_mb = round(data["memory_budget_bytes"] / (1024 * 1024))
              metric = (
                  f"{worst_time_ms:.2f}ms / {worst_memory_mb}MB "
                  f"(budgets: {time_budget_ms:.2f}ms/{memory_budget_mb}MB)"
              )

          print(f"status_label={status_label}")
          print(f"metric={metric}")
          PYEOF
        continue-on-error: true
    outputs:
      status_label: ${{ steps.summary.outputs.status_label }}
      metric: ${{ steps.summary.outputs.metric }}

  build:
    name: build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build
      - run: python -m build

  docs:
    name: docs
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: sphinx-build -b html docs/source docs/_build/html -W
      # Uploaded unconditionally (cheap); only actually deployed by deploy-docs
      # below, which is gated to pushes on main (Constitution Principle VII).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Posts/updates a single consolidated PR comment summarizing every quality
  # check's result (specs/004-pr-quality-check-summary). Runs after all eight
  # existing quality-check jobs, even if one of them failed/was cancelled
  # (`if: always()`), so it can accurately report that outcome instead of
  # being skipped itself (research.md #2). Restricted to `pull_request` runs
  # only (FR-006) - never for `push`-to-`main`, `schedule`, or
  # `workflow_dispatch` runs.
  quality-summary:
    name: quality-summary
    needs: [lint, complexity, typecheck, security, dependency-scan, test, build, docs, performance]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # The `test` job is a Python-version matrix, so it cannot expose a
      # meaningful single coverage number as a job output (see that job's
      # "Record canonical coverage percentage" step). Its canonical
      # `env.PYTHON_VERSION` leg publishes the number as this artifact
      # instead. `continue-on-error` so a `test` job that never got far
      # enough to produce it (cancelled, or the canonical leg's setup
      # failed) leaves the coverage cell as the documented "—" placeholder
      # rather than failing this job
      # (specs/013-tox-multi-python-testing research.md #5).
      - name: Download canonical coverage percentage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-pct
          path: coverage-pct
      - name: Read canonical coverage percentage
        id: coverage
        run: |
          set -euo pipefail
          pct=""
          if [ -f coverage-pct/coverage-pct.txt ]; then
            pct="$(tr -d '[:space:]' < coverage-pct/coverage-pct.txt)"
          fi
          echo "coverage_pct=$pct" >> "$GITHUB_OUTPUT"
      # Assembles the Markdown table + overall status into a file, which is
      # handed to the comment-posting step below via `path:` (research.md
      # #5). Failures here are left to fail this step normally (not
      # continue-on-error) since they indicate a bug in this logic, not a
      # permissions/environment limitation (research.md #6).
      - name: Build summary
        id: build-summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity.result }}
          COMPLEXITY_METRIC: ${{ needs.complexity.outputs.mi_summary }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_METRIC: ${{ steps.coverage.outputs.coverage_pct }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PERFORMANCE_STATUS: ${{ needs.performance.outputs.status_label }}
          PERFORMANCE_METRIC: ${{ needs.performance.outputs.metric }}
        run: |
          set -euo pipefail

          # status_label STATUS -> a distinct label per success/failure/
          # cancelled/skipped (contracts/pr-summary-comment-contract.md
          # Output contract item 1; never collapses skipped/cancelled into a
          # bare "failed", never omits a row).
          status_label() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              cancelled) echo "🚫 cancelled" ;;
              skipped) echo "⏭️ skipped" ;;
              *) echo "❓ unknown" ;;
            esac
          }

          # metric_or_placeholder VALUE -> the metric string, or the
          # explicit "no metric" placeholder if absent/empty (data-model.md
          # Quality Check Result; spec.md FR-005, US3 Acceptance Scenario 3).
          metric_or_placeholder() {
            if [ -n "$1" ]; then echo "$1"; else echo "—"; fi
          }

          # performance_status_label STATUS -> renders the performance job's
          # own status vocabulary (pass/fail/⚠️ degraded/skipped/cancelled -
          # data-model.md's Suite Run Summary.status_label), distinct from
          # the success/failure/cancelled/skipped vocabulary every other
          # `needs.<job>.result` uses, since `⚠️ degraded` is not one of
          # GitHub Actions' own job-result values (FR-013 Clarifications #3;
          # specs/004-pr-quality-check-summary FR-010).
          performance_status_label() {
            case "$1" in
              pass) echo "✅ pass" ;;
              fail) echo "❌ fail" ;;
              "⚠️ degraded") echo "⚠️ degraded" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "❓ unknown" ;;
            esac
          }

          {
            echo "<!-- quality-check-summary -->"
            echo "### Quality Check Summary"
            echo
            echo "| Check | Status | Metric |"
            echo "|---|---|---|"
            echo "| lint | $(status_label "$LINT_RESULT") | $(metric_or_placeholder "") |"
            echo "| complexity | $(status_label "$COMPLEXITY_RESULT") | $(metric_or_placeholder "$COMPLEXITY_METRIC") |"
            echo "| typecheck | $(status_label "$TYPECHECK_RESULT") | $(metric_or_placeholder "") |"
            echo "| security | $(status_label "$SECURITY_RESULT") | $(metric_or_placeholder "") |"
            echo "| dependency-scan | $(status_label "$DEPENDENCY_SCAN_RESULT") | $(metric_or_placeholder "") |"
            echo "| test | $(status_label "$TEST_RESULT") | $(metric_or_placeholder "$TEST_METRIC") |"
            echo "| build | $(status_label "$BUILD_RESULT") | $(metric_or_placeholder "") |"
            echo "| docs | $(status_label "$DOCS_RESULT") | $(metric_or_placeholder "") |"
            # `performance` is informational-only (specs/006-legacy-hardware-
            # performance-tests FR-013): shown here with its own metric, but
            # deliberately excluded from the `results=...` overall-status
            # computation below, the same way `⚠️ degraded` is never folded
            # into pass/fail.
            echo "| performance | $(performance_status_label "$PERFORMANCE_STATUS") | $(metric_or_placeholder "$PERFORMANCE_METRIC") |"
            echo
            # Overall status (data-model.md PR Summary Comment.overall_status):
            # FAIL if any check failed; else cancelled/incomplete if any
            # check was cancelled; else PASS. A `skipped` check never flips
            # this by itself (spec.md Assumptions).
            results="$LINT_RESULT $COMPLEXITY_RESULT $TYPECHECK_RESULT $SECURITY_RESULT $DEPENDENCY_SCAN_RESULT $TEST_RESULT $BUILD_RESULT $DOCS_RESULT"
            if echo "$results" | grep -qw "failure"; then
              echo "**Overall status: ❌ FAIL**"
            elif echo "$results" | grep -qw "cancelled"; then
              echo "**Overall status: 🚫 CANCELLED**"
            else
              echo "**Overall status: ✅ PASS**"
            fi
          } > summary.md

      # Posts/updates the single PR comment identified by `header:` (never
      # more than one per PR, edited in place on every subsequent run -
      # contracts/pr-summary-comment-contract.md Idempotency contract).
      # `continue-on-error: true` on this step only (not the whole job) so a
      # posting failure (e.g. a fork PR's read-only GITHUB_TOKEN) never fails
      # the job/workflow (FR-008; research.md #6).
      - name: Post or update PR comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: quality-check-summary
          path: summary.md

  deploy-docs:
    name: deploy-docs
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
