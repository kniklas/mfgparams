[tox]
envlist = py39, py310, py311, py312
skip_missing_interpreters = true

[testenv]
extras = test
# `{posargs}` so `tox -e py39 -- -k drilling -x` actually forwards those
# arguments to pytest. Without it tox silently discards everything after
# `--`, and a contributor narrowing down a version-specific failure gets a
# full run with no indication their filter was dropped.
commands = pytest {posargs}
