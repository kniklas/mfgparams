[tox]
envlist = py39, py310, py311, py312
skip_missing_interpreters = true

[testenv]
extras = test
# Editable, matching CI's `pip install -e ".[test]"`. tox 4 defaults to
# `package = sdist`, which installs into `.tox/pyXX/lib/...` — and at least one
# test keys off whether it is running from a source checkout
# (`tests/unit/test_version_single_source.py` resolves the repo root from
# `mfgparams.__file__`), so an sdist install silently ran a *smaller* suite
# than CI: 814 passed / 11 skipped under tox versus 815 / 10 in an editable
# venv. A contributor reintroducing a static `[project] version` would have
# seen a green `tox` and a red CI, and both the README and
# contracts/multi-version-testing-contract.md claim tox runs the same suite
# (code review finding).
package = editable
# Every env runs pytest from the repo root, so without this all four would
# write the same `<repo>/.coverage` database. Serial runs get away with it;
# `tox -p` (parallel) would have them clobbering each other, producing lock
# errors or a merged total that trips `--cov-fail-under=90` for reasons
# unrelated to the change under test (code review finding).
setenv =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
# `{posargs}` so arguments after `--` actually reach pytest. Without it tox
# silently discards them, and a contributor narrowing down a version-specific
# failure gets a full run with no indication their filter was dropped.
#
# Pass `--no-cov` alongside any narrowing filter:
#
#     tox -e py39 -- --no-cov -k drilling -x
#
# `[tool.pytest.ini_options].addopts` carries `--cov-fail-under=90`, which a
# subset of the suite will not meet -- so without `--no-cov` the env reports
# FAILED on the coverage gate even when every selected test passed, and the
# real failure you were chasing is buried under it (code review finding).
commands = pytest {posargs}
#
# NOTE: run tox serially. `tox -p`/`-p auto` is NOT supported here:
# `tests/integration/test_packaging_bundled_data.py` shells out to
# `python -m build`, and setuptools writes its scratch tree to `<repo>/build/`
# regardless of `--outdir` (see that file's docstring) — so parallel envs would
# race on one shared directory. `python -m build` exposes no way to relocate
# it, and the envs necessarily share this source tree.
